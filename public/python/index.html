<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python 蟒蛇闯关</title>
<meta name="description" content="从零开始学 Python 的闯关小游戏：26 关、125 道题，每关一张图示，打开就能玩。">
<meta name="theme-color" content="#EEF3FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1322" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="蟒蛇闯关">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="Python 蟒蛇闯关">
<meta property="og:description" content="从零开始学 Python 的闯关小游戏，打开就能玩。">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { height: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* 布局：单列手机应用。顶部状态条 + 滚动内容 + 底部固定大按钮；关卡地图是一条随通关变长的蛇。 */
:root {
  /* 颜色：取自 Python 的蓝和黄，中性色偏蓝 */
  --bg: #EEF3FA;
  --surface: #FFFFFF;
  --tint: #E3EBF7;
  --ink: #15233F;
  --ink-2: #55637E;
  --ink-3: #8D99B0;
  --line: #D3DDEC;
  --blue: #2C6CB5;
  --blue-text: #2462A8;
  --blue-soft: #DCE9F8;
  --btn: #2C6CB5;
  --btn-edge: #1D4C84;
  --yellow: #FFCB3D;
  --yellow-edge: #D79B00;
  --on-yellow: #2A2205;
  --good: #17805A;
  --good-bg: #E1F5EA;
  --bad: #C63D30;
  --bad-bg: #FCEAE7;
  --code-bg: #101C36;
  --code-bg-2: #0A1326;
  --code-fg: #E4ECF9;
  --code-dim: #8C9BBA;
  --code-key: #7CC0FF;
  --code-str: #FFD666;
  --code-num: #FFA86B;
  --code-fn: #8FE3B0;
  --shadow: 0 1px 2px rgba(21, 35, 63, .06), 0 8px 24px rgba(21, 35, 63, .08);
  /* 字体：正文用系统中文黑体，数字和代码用等宽体 */
  --font-body: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, "Roboto Mono", "Noto Sans Mono CJK SC", monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1322; --surface: #142038; --tint: #1D2C4B; --ink: #E7EEFA; --ink-2: #A9B6CF; --ink-3: #7382A0; --line: #293A5E;
    --blue: #5C9BE6; --blue-text: #86B7F2; --blue-soft: #1C3359; --btn: #3476CA; --btn-edge: #1F4E8C;
    --yellow: #FFCF4A; --yellow-edge: #C99200; --on-yellow: #2A2205;
    --good: #55CC9B; --good-bg: #12362B; --bad: #F58476; --bad-bg: #3D1E1D;
    --code-bg: #070D1B; --code-bg-2: #040812;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1322; --surface: #142038; --tint: #1D2C4B; --ink: #E7EEFA; --ink-2: #A9B6CF; --ink-3: #7382A0; --line: #293A5E;
  --blue: #5C9BE6; --blue-text: #86B7F2; --blue-soft: #1C3359; --btn: #3476CA; --btn-edge: #1F4E8C;
  --yellow: #FFCF4A; --yellow-edge: #C99200; --on-yellow: #2A2205;
  --good: #55CC9B; --good-bg: #12362B; --bad: #F58476; --bad-bg: #3D1E1D;
  --code-bg: #070D1B; --code-bg-2: #040812;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.7;
  /* 关掉连字：== != >= 这些符号必须按原样显示 */
  font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
h1, h2, h3, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
.ic { width: 1.25em; height: 1.25em; flex: none; display: block; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { max-width: 560px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 0 112px; }
.bar-in { max-width: 560px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

/* ---------- 顶部状态条 ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); margin: 0 calc(var(--gutter-r) * -1) 0 calc(var(--gutter-l) * -1); padding: 10px var(--gutter-r) 10px var(--gutter-l); display: flex; align-items: center; gap: 12px; min-height: 60px; }
.rank { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; }
.rank-badge { flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--btn); color: #fff; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 800; font-size: 20px; line-height: 1; box-shadow: 0 3px 0 var(--btn-edge); align-content: center; justify-items: center; gap: 1px; }
.rank-badge small { font-size: 10px; font-weight: 700; opacity: .85; line-height: 1; letter-spacing: .04em; }
.rank-main { min-width: 0; flex: 1; display: grid; gap: 5px; }
.rank-name { font-weight: 700; font-size: 15px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xpbar { height: 8px; border-radius: 4px; background: var(--tint); overflow: hidden; }
.xpbar > i { display: block; height: 100%; border-radius: 4px; background: var(--yellow); transition: width .5s ease; }
.stat { flex: none; display: flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1; }
.stat .ic { width: 22px; height: 22px; }
.stat-star .ic { color: var(--yellow); stroke: var(--yellow-edge); }
.stat-fire .ic { color: var(--bad); }
.stat-fire.is-zero { color: var(--ink-3); } .stat-fire.is-zero .ic { color: var(--ink-3); }

.top-nav { justify-content: space-between; }
.icon-btn { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--surface); border: 1.5px solid var(--line); color: var(--ink-2); flex: none; }
.icon-btn .ic { width: 22px; height: 22px; }
.top-title { flex: 1; min-width: 0; font-weight: 700; font-size: 16px; color: var(--ink-2); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-spacer { width: 48px; flex: none; }

/* ---------- 底部固定条 ---------- */
.tabbar, .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1.5px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .bar-in { display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { position: relative; min-height: 64px; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 13px; font-weight: 700; color: var(--ink-3); line-height: 1.2; }
.tab .ic { width: 26px; height: 26px; }
.tab.is-on { color: var(--blue-text); }
.tab-badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--bad); color: #fff; font-family: var(--font-mono); font-size: 12px; font-weight: 800; line-height: 20px; text-align: center; }
.actionbar .bar-in { padding-top: 12px; padding-bottom: 12px; display: grid; gap: 10px; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; padding: 10px 20px; border-radius: 16px; font-size: 18px; font-weight: 800; line-height: 1.25; text-align: center; background: var(--btn); color: #fff; box-shadow: 0 4px 0 var(--btn-edge); transition: transform .08s ease, box-shadow .08s ease; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--btn-edge); }
.btn[disabled] { background: var(--tint); color: var(--ink-3); box-shadow: 0 4px 0 var(--line); cursor: default; transform: none; }
.btn-ghost { background: var(--surface); color: var(--blue-text); box-shadow: 0 4px 0 var(--line); border: 1.5px solid var(--line); }
.btn-ghost:active { box-shadow: 0 1px 0 var(--line); }
.btn-good { background: var(--good); box-shadow: 0 4px 0 color-mix(in srgb, var(--good) 70%, #000); }
.btn-good:active { box-shadow: 0 1px 0 color-mix(in srgb, var(--good) 70%, #000); }
.btn-bad { background: var(--bad); box-shadow: 0 4px 0 color-mix(in srgb, var(--bad) 70%, #000); }
.btn-bad:active { box-shadow: 0 1px 0 color-mix(in srgb, var(--bad) 70%, #000); }
.btn-good, .btn-bad { color: var(--surface); }
.btn-text { min-height: 48px; width: 100%; font-weight: 700; font-size: 16px; color: var(--ink-2); border-radius: 12px; }
.btn-sm { min-height: 44px; width: auto; padding: 6px 16px; font-size: 15px; border-radius: 12px; box-shadow: 0 3px 0 var(--btn-edge); }
.btn-sm.btn-ghost { box-shadow: 0 3px 0 var(--line); }

/* ---------- 地图 ---------- */
.hello { margin-top: 4px; padding: 14px 16px; border-radius: 16px; background: var(--blue-soft); color: var(--ink); font-size: 16px; line-height: 1.6; }
.hello b { font-weight: 800; }
.map { position: relative; margin-top: 8px; container-type: inline-size; }
.snake { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.snake path { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
.snake .trail { stroke: var(--line); stroke-width: 8px; stroke-dasharray: 2 16; }
.snake .body { stroke: var(--btn); stroke-width: 26px; }
.snake .belly { stroke: var(--yellow); stroke-width: 6px; stroke-dasharray: 1 18; }
.snake .tail { stroke: var(--btn); stroke-width: 12px; }
.chap { position: absolute; left: 0; right: 0; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 2px; background: var(--bg); }
.chap-no { flex: none; font-family: var(--font-mono); font-size: 13px; font-weight: 800; color: var(--blue-text); background: var(--blue-soft); border-radius: 8px; padding: 4px 8px; line-height: 1.2; }
.chap-main { flex: 1; min-width: 0; display: grid; }
.chap-title { font-size: 20px; font-weight: 800; line-height: 1.25; }
.chap-sub { font-size: 14px; color: var(--ink-2); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chap-prog { flex: none; font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--ink-2); }

.node { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; display: grid; place-items: center; }
.node-dot { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 800; font-size: 22px; line-height: 1; }
.node.is-done .node-dot { background: var(--btn); color: #fff; border: 4px solid var(--surface); box-shadow: 0 0 0 3px var(--btn); }
.node.is-locked .node-dot { background: var(--surface); color: var(--ink-3); border: 2px dashed var(--ink-3); }
.node.is-locked .node-dot .ic { width: 24px; height: 24px; }
.node.is-current { width: 84px; height: 84px; margin: -42px 0 0 -42px; z-index: 2; }
.head { width: 84px; height: 100px; position: absolute; left: 0; top: 0; overflow: visible; }
.head .skin { fill: var(--btn); stroke: var(--surface); stroke-width: 4; }
.head .eye { fill: #fff; } .head .pupil { fill: #15233F; }
.head .tongue { fill: none; stroke: var(--bad); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.head .ring { fill: none; stroke: var(--yellow); stroke-width: 4; transform-origin: 42px 42px; animation: ring 1.8s ease-out infinite; }
@keyframes ring { 0% { transform: scale(.92); opacity: .9; } 100% { transform: scale(1.28); opacity: 0; } }
.node-label { position: absolute; top: 50%; transform: translateY(-50%); width: max-content; max-width: 46vw; max-width: calc(72cqw - 60px); display: grid; gap: 2px; text-align: left; background: var(--bg); padding: 4px 8px; border-radius: 12px; }
.node.on-left .node-label { left: calc(100% + 8px); }
.node.on-right .node-label { right: calc(100% + 8px); text-align: right; justify-items: end; }
.node-no { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--ink-2); line-height: 1.2; }
.node-title { font-size: 17px; font-weight: 800; line-height: 1.3; }
.node.is-locked .node-title, .node.is-locked .node-no { color: var(--ink-3); }
.node-stars { display: flex; gap: 2px; }
.node-stars .ic { width: 17px; height: 17px; color: var(--yellow); stroke: var(--yellow-edge); }
.node-stars .ic.off { color: transparent; stroke: var(--ink-3); }
.node-go { display: inline-flex; align-items: center; gap: 4px; background: var(--yellow); color: var(--on-yellow); font-size: 14px; font-weight: 800; border-radius: 10px; padding: 3px 10px; line-height: 1.4; box-shadow: 0 2px 0 var(--yellow-edge); }
.finish { margin-top: 12px; padding: 20px 16px; border-radius: 20px; background: var(--yellow); color: var(--on-yellow); text-align: center; display: grid; gap: 4px; justify-items: center; }
.finish b { font-size: 22px; font-weight: 800; line-height: 1.3; }
.finish .ic { width: 40px; height: 40px; }

/* ---------- 讲解 ---------- */
.lesson-head { padding-top: 6px; display: grid; gap: 6px; }
.eyebrow { font-family: var(--font-mono); font-size: 14px; font-weight: 800; color: var(--blue-text); letter-spacing: .04em; }
h1 { font-size: 30px; font-weight: 800; line-height: 1.25; text-wrap: balance; }
.hook { font-size: 18px; color: var(--ink-2); line-height: 1.5; }
.fig { margin-top: 18px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px 12px 12px; }
.fig svg { display: block; width: 100%; height: auto; }
.fig figcaption { margin-top: 10px; padding: 10px 4px 0; border-top: 1.5px dashed var(--line); font-size: 15px; line-height: 1.55; color: var(--ink-2); }
.sec { margin-top: 26px; display: grid; gap: 10px; }
.sec-tag { justify-self: start; font-size: 15px; font-weight: 800; line-height: 1.2; color: var(--blue-text); background: var(--blue-soft); padding: 6px 12px; border-radius: 10px; }
.sec p { font-size: 17px; }
.sec ul { display: grid; gap: 8px; }
.sec li { position: relative; padding-left: 20px; font-size: 17px; line-height: 1.65; }
.sec li::before { content: ""; position: absolute; left: 3px; top: .72em; width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 1.5px var(--yellow-edge); }
.sec-tip { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.sec-tip .sec-tag { color: var(--on-yellow); background: var(--yellow); }
code { font-family: var(--font-mono); font-size: .9em; background: var(--tint); color: var(--ink); padding: 2px 6px; border-radius: 6px; overflow-wrap: anywhere; }
strong, b { font-weight: 800; }

.code { margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 14px; padding: 14px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; font-family: var(--font-mono); font-size: 14px; line-height: 1.7; white-space: pre; tab-size: 4; }
@media (min-width: 400px) { .code { font-size: 15px; } }
.c-key { color: var(--code-key); } .c-str { color: var(--code-str); } .c-num { color: var(--code-num); } .c-fn { color: var(--code-fn); } .c-com { color: var(--code-dim); }
.blank { display: inline-block; min-width: 3.2em; text-align: center; border-radius: 6px; background: var(--yellow); color: var(--on-yellow); font-weight: 800; padding: 0 6px; line-height: 1.45; }
.blank.is-right { background: #2FB37E; color: #fff; }
.demo { border-radius: 16px; overflow: hidden; background: var(--code-bg); }
.demo .code { border-radius: 0; }
.demo-bar { display: flex; gap: 10px; padding: 10px 12px; background: var(--code-bg-2); align-items: center; }
.demo-btn { min-height: 44px; padding: 6px 16px; border-radius: 12px; font-size: 16px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; line-height: 1.2; }
.demo-run { background: var(--yellow); color: var(--on-yellow); box-shadow: 0 3px 0 var(--yellow-edge); }
.demo-run:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--yellow-edge); }
.demo-copy { color: var(--code-fg); border: 1.5px solid #3A4B72; margin-left: auto; font-weight: 700; font-size: 15px; }
.demo-out { border-top: 1.5px dashed #3A4B72; padding: 12px 16px 14px; background: var(--code-bg-2); }
.demo-out-label { font-size: 13px; font-weight: 700; color: var(--code-dim); line-height: 1.4; }
.demo-out pre { margin: 4px 0 0; font-family: var(--font-mono); font-size: 15px; line-height: 1.7; color: var(--code-fg); white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.7em; }
.demo-out .typed { color: var(--code-str); font-weight: 700; }
.demo-out .ln-in { display: block; animation: lineIn .22s ease both; }
@keyframes lineIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.demo-note { font-size: 14px; color: var(--ink-2); line-height: 1.5; }

/* 图示里的 SVG 元素 */
.fig text { font-family: var(--font-body); }
.fig .t { font-size: 13px; fill: var(--ink); }
.fig .ts { font-size: 12px; fill: var(--ink-2); }
.fig .tm { font-family: var(--font-mono); font-size: 12.5px; fill: var(--ink); white-space: pre; }
.fig .tl { font-family: var(--font-mono); font-size: 17px; font-weight: 800; fill: var(--ink); }
.fig .tc { font-family: var(--font-mono); font-size: 12.5px; fill: var(--code-fg); white-space: pre; }
.fig .tb { font-weight: 800; }
.fig .tc-key { fill: var(--code-key); } .fig .tc-dim { fill: var(--code-dim); }
.fig .t-blue { fill: var(--blue-text); } .fig .t-good { fill: var(--good); } .fig .t-bad { fill: var(--bad); } .fig .t-mute { fill: var(--ink-3); } .fig .t-ink { fill: var(--ink); }
.fig .on-yel { fill: var(--on-yellow); } .fig .on-blue { fill: #fff; }
.fig .box { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.5; }
.fig .box-soft { fill: var(--tint); stroke: none; }
.fig .box-yel { fill: var(--yellow); stroke: var(--yellow-edge); }
.fig .box-blue { fill: var(--btn); stroke: none; }
.fig .box-code { fill: var(--code-bg); stroke: none; }
.fig .box-good { fill: var(--good-bg); stroke: var(--good); }
.fig .box-bad { fill: var(--bad-bg); stroke: var(--bad); }
.fig .box-hi { fill: var(--blue-soft); stroke: var(--blue); }
.fig .box-dash { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 3; }
.fig .dot { fill: var(--ink-2); } .fig .dot-blue { fill: var(--btn); } .fig .dot-yel { fill: var(--yellow); stroke: var(--yellow-edge); stroke-width: 1.5; }
.fig .ln { fill: none; stroke: var(--ink-2); stroke-width: 1.5; }
.fig .ln-blue { stroke: var(--blue); } .fig .ln-good { stroke: var(--good); } .fig .ln-bad { stroke: var(--bad); }
.fig .ln-yel { stroke: var(--yellow-edge); stroke-width: 2.5; stroke-linecap: round; }
.fig .ln-thick { stroke-width: 2.5; stroke-linecap: round; }
.fig .ln-faint { stroke: var(--line); }
.fig .hd { fill: var(--ink-2); } .fig .hd-blue { fill: var(--blue); } .fig .hd-good { fill: var(--good); } .fig .hd-bad { fill: var(--bad); }
.fig .venn-a { fill: var(--blue); fill-opacity: .2; stroke: var(--blue); stroke-width: 1.5; }
.fig .venn-b { fill: var(--yellow); fill-opacity: .32; stroke: var(--yellow-edge); stroke-width: 1.5; }

/* ---------- 答题 ---------- */
.progress { flex: 1; display: flex; gap: 5px; min-width: 0; }
.progress i { flex: 1; height: 10px; border-radius: 5px; background: var(--tint); }
.progress i.is-right { background: var(--good); } .progress i.is-wrong { background: var(--bad); } .progress i.is-now { background: var(--yellow); box-shadow: 0 0 0 1.5px var(--yellow-edge); }
.quiz { padding-top: 6px; display: grid; gap: 16px; }
.q-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.q-type { font-size: 14px; font-weight: 800; line-height: 1.2; padding: 5px 10px; border-radius: 8px; background: var(--blue-soft); color: var(--blue-text); }
.q-from { font-size: 14px; color: var(--ink-2); line-height: 1.2; }
.q-stem { font-size: 21px; font-weight: 800; line-height: 1.45; text-wrap: pretty; }
.q-stem code { font-size: .86em; }
.opts { display: grid; gap: 12px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 12px 14px; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; box-shadow: 0 3px 0 var(--line); font-size: 17px; line-height: 1.5; transition: transform .08s ease; }
.opt:active:not([disabled]) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt-key { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--tint); color: var(--ink-2); font-family: var(--font-mono); font-weight: 800; font-size: 15px; line-height: 1; }
.opt-key .ic { width: 18px; height: 18px; }
.opt-body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt-body pre { margin: 0; font-family: var(--font-mono); font-size: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.opt-body code { background: none; padding: 0; font-size: 16px; }
.opt-body .opt-note { color: var(--ink-2); font-weight: 700; }
.opt.is-picked { border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 3px 0 var(--blue); }
.opt.is-picked .opt-key { background: var(--btn); color: #fff; }
.opt[disabled] { cursor: default; }
.opt.is-dim { opacity: .5; box-shadow: none; }
.opt.is-right { border-color: var(--good); background: var(--good-bg); box-shadow: 0 3px 0 var(--good); }
.opt.is-right .opt-key { background: var(--good); color: var(--surface); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 3px 0 var(--bad); }
.opt.is-wrong .opt-key { background: var(--bad); color: var(--surface); }

.fill { display: grid; gap: 10px; }
.fill-label { font-size: 15px; font-weight: 700; color: var(--ink-2); }
.fill-input { width: 100%; height: 60px; padding: 0 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--font-mono); font-size: 22px; font-weight: 700; }
.fill-input::placeholder { color: var(--ink-3); font-weight: 400; font-size: 17px; font-family: var(--font-body); }
.fill-input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 4px var(--blue-soft); }
.fill-input.is-right { border-color: var(--good); background: var(--good-bg); }
.fill-input.is-wrong { border-color: var(--bad); background: var(--bad-bg); }
.keys { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; margin-right: calc(var(--gutter-r) * -1); padding-right: var(--gutter-r); scrollbar-width: none; }
.keys::-webkit-scrollbar { display: none; }
.key { flex: none; min-width: 46px; height: 46px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); box-shadow: 0 2px 0 var(--line); font-family: var(--font-mono); font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1; }
.key:active { transform: translateY(2px); box-shadow: none; }

.fb { border-radius: 18px; padding: 16px; display: grid; gap: 12px; scroll-margin-bottom: 120px; animation: fbIn .25s ease both; }
@keyframes fbIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.fb.good { background: var(--good-bg); }
.fb.bad { background: var(--bad-bg); }
.fb-head { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 800; line-height: 1.3; }
.fb.good .fb-head { color: var(--good); } .fb.bad .fb-head { color: var(--bad); }
.fb-head .ic { width: 30px; height: 30px; }
.fb-gain { margin-left: auto; font-family: var(--font-mono); font-size: 18px; }
.fb-streak { font-size: 15px; font-weight: 700; color: var(--good); display: flex; align-items: center; gap: 4px; line-height: 1.3; }
.fb-streak .ic { width: 18px; height: 18px; }
.fb-block { display: grid; gap: 2px; }
.fb-label { font-size: 14px; font-weight: 800; line-height: 1.4; color: var(--ink-2); }
.fb.bad .fb-label.is-why { color: var(--bad); }
.fb-block p { font-size: 17px; line-height: 1.65; }
.fb-ans { font-family: var(--font-mono); font-size: 16px; font-weight: 700; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
.fb-ans.plain { font-family: var(--font-body); }
.fb-note { font-size: 15px; color: var(--ink-2); line-height: 1.55; }

/* ---------- 结算 ---------- */
.result { padding-top: 28px; display: grid; gap: 18px; justify-items: center; text-align: center; }
.stars { display: flex; gap: 10px; align-items: flex-end; height: 92px; }
.stars .ic { width: 68px; height: 68px; color: var(--yellow); stroke: var(--yellow-edge); animation: pop .45s cubic-bezier(.2, 1.6, .4, 1) both; }
.stars .ic:nth-child(2) { width: 88px; height: 88px; animation-delay: .15s; }
.stars .ic:nth-child(3) { animation-delay: .3s; }
.stars .ic.off { color: var(--tint); stroke: var(--ink-3); animation: none; }
@keyframes pop { from { transform: scale(0) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
.result h1 { font-size: 32px; }
.result-sub { font-size: 17px; color: var(--ink-2); max-width: 30em; }
.tiles { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 6px; display: grid; gap: 2px; min-width: 0; }
.tile b { font-family: var(--font-mono); font-size: 24px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile span { font-size: 13px; color: var(--ink-2); line-height: 1.3; }
.levelup { width: 100%; background: var(--yellow); color: var(--on-yellow); border-radius: 18px; padding: 14px 16px; display: grid; gap: 2px; box-shadow: 0 4px 0 var(--yellow-edge); animation: pop .5s .4s cubic-bezier(.2, 1.4, .4, 1) both; }
.levelup small { font-size: 14px; font-weight: 800; letter-spacing: .08em; }
.levelup b { font-size: 22px; line-height: 1.3; }
.result-actions { width: 100%; display: grid; gap: 12px; margin-top: 4px; }
.result-note { font-size: 15px; color: var(--ink-2); }

/* ---------- 错题本 / 我的 ---------- */
.page-head { padding-top: 8px; display: grid; gap: 4px; }
.page-head h1 { font-size: 28px; }
.page-head p { color: var(--ink-2); font-size: 16px; }
.empty { margin-top: 24px; padding: 28px 20px; border: 2px dashed var(--line); border-radius: 20px; text-align: center; display: grid; gap: 8px; justify-items: center; color: var(--ink-2); }
.empty .ic { width: 44px; height: 44px; color: var(--ink-3); }
.empty b { color: var(--ink); font-size: 19px; }
.book-cta { margin-top: 16px; }
.book-group { margin-top: 22px; display: grid; gap: 10px; }
.book-group h2 { font-size: 15px; font-weight: 800; color: var(--ink-2); line-height: 1.3; }
.wq { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.wq-top { display: flex; align-items: center; gap: 8px; }
.wq-n { margin-left: auto; font-size: 14px; font-weight: 700; color: var(--bad); }
.wq-stem { font-size: 17px; font-weight: 700; line-height: 1.5; }
.wq .code { font-size: 13px; padding: 10px 12px; border-radius: 10px; max-height: 9.5em; }
.wq .btn { justify-self: start; }

.card { margin-top: 16px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
.card h2 { font-size: 18px; font-weight: 800; line-height: 1.3; }
.card p { font-size: 16px; color: var(--ink-2); line-height: 1.6; }
.me-rank { display: flex; align-items: center; gap: 14px; }
.me-rank .rank-badge { width: 64px; height: 64px; border-radius: 20px; font-size: 28px; }
.me-rank .rank-badge small { font-size: 12px; }
.me-rank-main { flex: 1; min-width: 0; display: grid; gap: 6px; }
.me-rank-name { font-size: 22px; font-weight: 800; line-height: 1.25; }
.me-rank-next { font-size: 14px; color: var(--ink-2); line-height: 1.3; }
.me-rank .xpbar { height: 12px; border-radius: 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chap-rows { display: grid; gap: 12px; }
.chap-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 16px; }
.chap-row b { font-weight: 700; }
.chap-row span { font-family: var(--font-mono); font-size: 14px; color: var(--ink-2); }
.chap-row .xpbar { grid-column: 1 / -1; }
.chap-row .xpbar > i { background: var(--btn); }
.steps { display: grid; gap: 8px; counter-reset: s; }
.steps li { counter-increment: s; position: relative; padding-left: 34px; font-size: 16px; line-height: 1.6; color: var(--ink); }
.steps li::before { content: counter(s); position: absolute; left: 0; top: .15em; width: 24px; height: 24px; border-radius: 8px; background: var(--blue-soft); color: var(--blue-text); font-family: var(--font-mono); font-weight: 800; font-size: 14px; display: grid; place-items: center; line-height: 1; }
.confirm { display: grid; gap: 10px; padding: 14px; border-radius: 14px; background: var(--bad-bg); }
.confirm p { color: var(--ink); }
.confirm-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.warn { padding: 12px 14px; border-radius: 14px; background: var(--bad-bg); color: var(--ink); font-size: 15px; line-height: 1.55; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); z-index: 40; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); font-size: 16px; font-weight: 700; line-height: 1.4; padding: 12px 18px; border-radius: 14px; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; text-align: center; }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }
.float-gain { position: fixed; z-index: 41; left: 50%; top: 26%; transform: translateX(-50%); font-family: var(--font-mono); font-size: 34px; font-weight: 800; color: var(--good); pointer-events: none; animation: floatUp .9s ease-out both; text-shadow: 0 2px 0 var(--surface); }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 16px) scale(.7); } 25% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -56px) scale(1); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .head .ring { display: none; }
}
</style>

<body>
<div class="app" id="view"></div>
<div id="bar"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;font-size:18px">这个游戏需要开启 JavaScript 才能运行。</p></noscript>
<script>
(function () {
/* ===== 关卡内容（第一、二章）===== */
var py = String.raw;
var OUT_Q = '这段代码运行后，屏幕上显示什么？';
var CHAPTERS = [
  { id: 'c1', title: '起步', sub: '让 Python 开口说话' },
  { id: 'c2', title: '判断', sub: '让程序学会做选择' },
  { id: 'c3', title: '列表与循环', sub: '一次处理一大批数据' },
  { id: 'c4', title: '更多容器', sub: '元组、字典、集合各有所长' },
  { id: 'c5', title: '函数与字符串', sub: '把代码打包起来反复用' },
  { id: 'c6', title: '进阶', sub: '排错、存文件、借工具、造对象' },
];
var LEVELS = [];
function L(level) { LEVELS.push(level); }

/* ---------- 第一章 起步 ---------- */

L({
  id: 'print', ch: 'c1', title: 'print 输出', hook: '让 Python 把话显示到屏幕上',
  syntax: py`print("你好")
print(123)
print("年龄", 18)`,
  how: [
    '`print` 后面跟一对英文圆括号 `()`，要显示的内容放在括号里。',
    '文字要用引号包起来，单引号、双引号都可以；数字不用引号。',
    '用逗号隔开，可以一次显示多个内容，它们之间会自动加一个空格。',
  ],
  mean: 'print 是“打印”的意思。Python 运行到这一行，就把括号里的内容显示在屏幕上，然后自动换到下一行。',
  use: '程序算出的结果，不 print 出来你就看不到。它也是找错误最常用的办法：在可疑的地方 print 一下，看看值对不对。',
  example: {
    code: py`print("你好，Python！")
print(2026)
print("我今年", 18, "岁")
# 以 # 开头的是注释，Python 会跳过它`,
    out: '你好，Python！\n2026\n我今年 18 岁',
  },
  tip: '括号、引号、逗号都必须是英文符号。写成中文的 `（）`、`“”`、`，` 会报错。',
  questions: [
    {
      id: 'print-1', type: 'choice', q: '下面哪一行能在屏幕上显示 你好？',
      opts: [
        { t: '`print("你好")`', ok: true },
        { t: '`print(你好)`', why: '没有引号，Python 会把 你好 当成一个变量名去找，找不到就报错。文字必须加引号。' },
        { t: '`Print("你好")`', why: 'Python 区分大小写，`Print` 和 `print` 不是同一个东西。必须全部小写。' },
        { t: '`print "你好"`', why: '少了括号。print 后面必须跟一对圆括号 `()`。' },
      ],
      explain: '正确写法有三个要点：`print` 全小写、后面有圆括号、文字用引号包起来。',
      checks: [
        { code: py`print(你好)`, err: 'NameError' },
        { code: py`Print("你好")`, err: 'NameError' },
        { code: py`print "你好"`, err: 'SyntaxError' },
      ],
    },
    {
      id: 'print-2', type: 'output', q: OUT_Q,
      code: py`print("1 + 1")
print(1 + 1)`,
      opts: [
        { t: '1 + 1\n2', ok: true },
        { t: '2\n2', why: '第一行的 1 + 1 在引号里。引号里的内容是文字，会原样显示，不会被计算。' },
        { t: '1 + 1\n1 + 1', why: '第二行没有引号，Python 会先算出 1 + 1 的结果 2，再显示出来。' },
        { t: '1 + 12', why: '每个 print 显示完都会自动换行，所以两次输出在两行，不会连在一起。' },
      ],
      explain: '有引号：原样显示。没引号：先计算，再显示结果。',
    },
    {
      id: 'print-3', type: 'fill', q: '补全代码，让屏幕显示 Hello',
      code: py`____("Hello")`,
      answers: ['print'], expect: 'Hello',
      hints: {
        'Print': 'Python 区分大小写，要全部小写：print。',
        'PRINT': 'Python 区分大小写，要全部小写：print。',
        'printf': 'printf 是 C 语言的写法，Python 里是 print。',
        'echo': 'echo 是别的语言的写法，Python 里是 print。',
      },
      explain: '显示内容用 `print`，全小写。',
    },
    {
      id: 'print-4', type: 'output', q: OUT_Q,
      code: py`print("苹果", "香蕉")`,
      opts: [
        { t: '苹果 香蕉', ok: true },
        { t: '苹果香蕉', why: '用逗号隔开的内容，显示时中间会自动加一个空格。' },
        { t: '苹果,香蕉', why: '这里的逗号只是分隔符，告诉 print 有两个内容，它本身不会被显示。' },
        { t: '苹果\n香蕉', why: '它们在同一个 print 里，所以显示在同一行。写两个 print 才会分成两行。' },
      ],
      explain: '一个 print 里用逗号隔开多个内容：显示在同一行，中间自动加空格。',
    },
    {
      id: 'print-5', type: 'output', q: OUT_Q,
      code: py`# print("第一行")
print("第二行")`,
      opts: [
        { t: '第二行', ok: true },
        { t: '第一行\n第二行', why: '第一行以 # 开头，整行都是注释。注释是写给人看的，Python 不会执行它。' },
        { t: '# print("第一行")\n第二行', why: '注释既不会被执行，也不会被显示出来。' },
        { none: true, why: '第二行没有 #，是正常的代码，会被执行。' },
      ],
      explain: '`#` 后面的内容是注释，Python 直接跳过。常用来写说明，或者暂时“关掉”一行代码。',
    },
  ],
});

L({
  id: 'var', ch: 'c1', title: '变量', hook: '给数据起个名字，存起来以后用',
  syntax: py`age = 18
name = "小明"
age = age + 1`,
  how: [
    '写法是 `名字 = 值`。`=` 的意思是“把右边的值存起来，贴上左边的名字”，它不是数学里的“等于”。',
    '变量名可以用字母、数字和下划线，不能以数字开头，不能有空格。大小写算不同的名字。',
    '对同一个变量再赋值，旧的值就被新的值换掉。',
  ],
  mean: '变量像一个贴了标签的盒子。`age = 18` 就是把 18 放进贴着 age 标签的盒子里。以后写 age，Python 就取出盒子里的值来用。',
  use: '数据存进变量，才能反复使用、随时修改。游戏里的分数、血量、玩家名字，都是变量。',
  example: {
    code: py`name = "小明"
age = 18
print(name, "今年", age, "岁")
age = age + 1
print("明年", age, "岁")`,
    out: '小明 今年 18 岁\n明年 19 岁',
  },
  tip: '`age = age + 1` 要从右往左读：先算右边的 18 + 1，再把结果 19 存回 age。',
  questions: [
    {
      id: 'var-1', type: 'output', q: OUT_Q,
      code: py`x = 5
x = x + 2
print(x)`,
      opts: [
        { t: '7', ok: true },
        { t: '5', why: '第二行已经把 x 更新了：先算 5 + 2，再把 7 存回 x。原来的 5 被换掉了。' },
        { t: 'x + 2', why: 'print(x) 里没有引号，显示的是 x 里存的值，不是文字。' },
        { t: '52', why: '5 和 2 都是数字，`+` 做的是加法，得到 7。只有文字相加才会接在一起。' },
      ],
      explain: '`x = x + 2`：先取出 x 的值 5，加 2 得 7，再存回 x。',
    },
    {
      id: 'var-2', type: 'choice', q: '下面哪个是合法的变量名？',
      opts: [
        { t: '`my_score`', ok: true },
        { t: '`2name`', why: '变量名不能以数字开头。可以改成 `name2`。' },
        { t: '`my score`', why: '变量名里不能有空格。想分开两个词，用下划线：`my_score`。' },
        { t: '`my-score`', why: '减号会被 Python 当成减法，变成“my 减 score”。要用下划线。' },
      ],
      explain: '变量名只能用字母、数字、下划线，而且不能以数字开头。',
      checks: [
        { code: py`my_score = 1
print(my_score)`, out: '1' },
        { code: py`2name = 1`, err: 'SyntaxError' },
        { code: py`my score = 1`, err: 'SyntaxError' },
        { code: py`my-score = 1`, err: 'SyntaxError' },
      ],
    },
    {
      id: 'var-3', type: 'choice', q: '`name = "小明"` 这行代码做了什么？',
      opts: [
        { t: '把 "小明" 存进名叫 name 的变量', ok: true },
        { t: '判断 name 是不是等于 "小明"', why: '一个 `=` 是赋值，不是判断。判断相等要用两个等号 `==`，后面的关卡会学。' },
        { t: '在屏幕上显示 小明', why: '赋值只是把数据存起来，不会显示任何东西。要显示得用 print。' },
        { t: '把变量 name 改名叫 小明', why: '`=` 左边是名字，右边是要存的值。这里是把值存进 name，名字没有变。' },
      ],
      explain: '`=` 是赋值：把右边的值存到左边的变量里。',
    },
    {
      id: 'var-4', type: 'fill', q: '补全代码，让它显示 10',
      code: py`score = 7
score = score ____ 3
print(score)`,
      answers: ['+'], expect: '10',
      hints: {

L({

    '`finally` 可以不写。写了的话，不管有没有出错，它都会执行。',

      html += '</div>';
    } else {
      html += '<div class="opts" role="group" aria-label="选项">' + it.opts.map(function (o, k) {
        var cls = 'opt', key = 'ABCD'.charAt(k);
        if (it.done) {
          if (o.ok) { cls += ' is-right'; key = ICON.check; }
          else if (k === it.picked) { cls += ' is-wrong'; key = ICON.x; }
          else cls += ' is-dim';
        } else if (k === it.picked) cls += ' is-picked';
        return '<button class="' + cls + '" data-act="pick" data-k="' + k + '"' + (it.done ? ' disabled' : '') + ' aria-pressed="' + (k === it.picked) + '">' +
          '<span class="opt-key">' + key + '</span><span class="opt-body">' + optBody(q, o) + '</span></button>';
      }).join('') + '</div>';
    }
    if (it.done) html += feedback(it);
    html += '</div>';
    $view.innerHTML = html;
    var last = quiz.pos === n - 1;
    $bar.innerHTML = '<div class="actionbar"><div class="bar-in">' + (it.done
      ? '<button class="btn ' + (it.ok ? 'btn-good' : 'btn-bad') + '" data-act="next">' + (last ? '看结果' : '下一题') + '</button>'
      : '<button class="btn" id="confirm" data-act="confirm"' + (canConfirm(it) ? '' : ' disabled') + '>确定</button>') + '</div></div>';
  }
  function canConfirm(it) { return it.q.type === 'fill' ? norm(it.input) !== '' : it.picked >= 0; }
  function fbBlock(label, bodyHtml, cls) { return '<div class="fb-block"><div class="fb-label' + (cls ? ' ' + cls : '') + '">' + label + '</div>' + bodyHtml + '</div>'; }
  function feedback(it) {
    var q = it.q, html;
    if (it.ok) {
      html = '<div class="fb good" id="fb" role="status"><div class="fb-head">' + ICON.check + '<span>答对了！</span><span class="fb-gain">+' + it.gain + ' 分</span></div>';
      if (it.bonus > 0) html += '<div class="fb-streak">' + ICON.flame + '连胜 ' + it.streak + ' 题，多加 ' + it.bonus + ' 分</div>';
      html += fbBlock('解析', '<p>' + fmt(q.explain) + '</p>');
      if (it.cn) html += '<p class="fb-note">注意：你输入的是中文符号。真正写代码时要切换到英文输入法，否则 Python 会报错。</p>';
      if (quiz.mode === 'review') html += '<p class="fb-note">这道题已经掌握，从错题本里移走了。</p>';
      return html + '</div>';
    }
    html = '<div class="fb bad" id="fb" role="status"><div class="fb-head">' + ICON.x + '<span>答错了</span></div>';
    if (q.type === 'fill') {
      var hint = null, key = norm(it.input);
      Object.keys(q.hints || {}).forEach(function (h) { if (norm(h) === key) hint = q.hints[h]; });
      html += fbBlock('为什么错', '<p>你填的是 <code>' + esc(it.input.trim()) + '</code>。' + (hint ? fmt(hint) : '把它填进去，代码得不到题目要的结果。') + '</p>', 'is-why');
      html += fbBlock('正确答案', '<div class="fb-ans">' + q.answers.map(esc).join('  或  ') + '</div>');
    } else {
      var picked = it.opts[it.picked], right = it.opts.filter(function (o) { return o.ok; })[0];
      html += fbBlock('为什么错', '<p>' + fmt(picked.why) + '</p>', 'is-why');
      html += fbBlock('正确答案', q.type === 'output' && right.t ? '<div class="fb-ans">' + esc(right.t) + '</div>' : '<div class="fb-ans plain">' + (right.t ? fmt(right.t) : esc(optPlain(q, right))) + '</div>');
    }
    html += fbBlock('解析', '<p>' + fmt(q.explain) + '</p>');
    html += '<p class="fb-note">' + (quiz.mode === 'review' ? '这道题还留在错题本里，下次再练。' : '这道题已经放进错题本，可以随时重练。') + '</p>';
    return html + '</div>';
  }
  function confirmAnswer() {
    var it = quiz.items[quiz.pos], q = it.q;
    if (it.done || !canConfirm(it)) return;
    var ok;
    if (q.type === 'fill') {
      var v = norm(it.input);
      ok = q.answers.some(function (a) { return norm(a) === v; });
      it.cn = ok && hasCnPunct(it.input);
    } else ok = !!it.opts[it.picked].ok;
    it.done = true; it.ok = ok;
    state.answered++; touchDay();
    if (ok) {
      state.correct++; state.streak++;
      if (state.streak > state.best) state.best = state.streak;
      it.streak = state.streak;
      it.bonus = Math.min((state.streak - 1) * 2, 10);
      it.gain = (quiz.mode === 'review' ? 5 : 10) + it.bonus;
      state.xp += it.gain; quiz.gain += it.gain; quiz.right++;
      if (quiz.mode === 'review') { delete state.wrong[q.id]; quiz.cleared++; }
    } else {
      state.streak = 0;
      var w = state.wrong[q.id] || { n: 0, t: 0 };
      w.n++; w.t = Date.now(); state.wrong[q.id] = w;
    }
    save();
    viewQuiz();
    if (ok) {
      var f = document.createElement('div'); f.className = 'float-gain'; f.textContent = '+' + it.gain; f.setAttribute('aria-hidden', 'true');
      document.body.appendChild(f); setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 950);
    }
    var fb = $('#fb');
    if (fb) { try { fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {} }
  }
  function clearFloat() {
    Array.prototype.forEach.call(document.querySelectorAll('.float-gain'), function (f) { f.parentNode.removeChild(f); });
  }
  function nextQuestion() {
    if (!quiz || quiz.finished) return;
    clearFloat();
    if (quiz.pos < quiz.items.length - 1) { quiz.pos++; viewQuiz(); window.scrollTo(0, 0); return; }
    quiz.finished = true;
    if (quiz.mode === 'level') {
      var lv = LEVELS[quiz.li], total = quiz.items.length, wrongN = total - quiz.right;
      var passed = quiz.right >= Math.ceil(total / 2);
      var stars = !passed ? 0 : wrongN === 0 ? 3 : wrongN === 1 ? 2 : 1;
      var rec = state.levels[lv.id] || { stars: 0, plays: 0 };
      rec.plays++;
      quiz.starBonus = Math.max(0, stars - rec.stars) * 10;
      rec.stars = Math.max(rec.stars, stars);
      state.levels[lv.id] = rec; state.xp += quiz.starBonus; quiz.gain += quiz.starBonus;
      quiz.stars = stars; quiz.passed = passed; state.last = lv.id;
    }
    quiz.rank1 = rankInfo(state.xp).lv;
    save();
    viewResult(); window.scrollTo(0, 0);
  }

  /* ---------- 结算 ---------- */
  function viewResult() {
    var n = quiz.items.length, wrongN = n - quiz.right, html, actions = '';
    var up = quiz.rank1 > quiz.rank0 ? '<div class="levelup"><small>升级了</small><b>Lv' + quiz.rank1 + ' ' + esc(RANKS[quiz.rank1 - 1].name) + '</b></div>' : '';
    html = '<header class="top top-nav"><button class="icon-btn" data-act="go" data-to="levels" aria-label="返回地图">' + ICON.back + '</button><span class="top-title">' + (quiz.mode === 'review' ? '错题重练' : '第 ' + (quiz.li + 1) + ' 关 ' + esc(LEVELS[quiz.li].title)) + '</span><span class="top-spacer"></span></header>';
    html += '<div class="result">';
    if (quiz.mode === 'level') {
      var need = Math.ceil(n / 2), isLast = quiz.li === LEVELS.length - 1;
      html += '<div class="stars" role="img" aria-label="获得 ' + quiz.stars + ' 颗星">' + starRow(quiz.stars) + '</div>';
      if (quiz.passed) {
        html += '<h1>' + (quiz.stars === 3 ? '满分通关！' : quiz.stars === 2 ? '通关！' : '过关了') + '</h1>' +
          '<p class="result-sub">答对 ' + quiz.right + ' / ' + n + ' 题。' + (isLast ? '你已经学完了 Python 入门的全部内容。' : quiz.stars === 3 ? '这一关的知识点你已经掌握了。' : '再练一次全对，就能拿到三颗星。') + '</p>';
      } else {
        html += '<h1>差一点点</h1><p class="result-sub">答对 ' + quiz.right + ' / ' + n + ' 题，至少答对 ' + need + ' 题才能过关。再看一遍讲解，马上重来。</p>';
      }
      html += '<div class="tiles"><div class="tile"><b>+' + quiz.gain + '</b><span>本关得分</span></div><div class="tile"><b>' + state.streak + '</b><span>当前连胜</span></div><div class="tile"><b>' + wrongN + '</b><span>进错题本</span></div></div>' + up;
      if (quiz.passed) {
        actions += isLast ? '<button class="btn" data-act="go" data-to="levels" data-replace="1">回到地图</button>'
          : '<button class="btn" data-act="go" data-to="level-' + (quiz.li + 2) + '" data-replace="1">下一关：' + esc(LEVELS[quiz.li + 1].title) + '</button>';
        if (wrongN) actions += '<button class="btn btn-ghost" data-act="review-these">重练刚才的错题</button>';
        if (quiz.stars < 3) actions += '<button class="btn btn-ghost" data-act="retry">再练一次，冲三星</button>';
        if (!isLast) actions += '<button class="btn-text" data-act="go" data-to="levels" data-replace="1">回到地图</button>';
      } else {
        actions += '<button class="btn" data-act="go" data-to="level-' + (quiz.li + 1) + '" data-replace="1">再看一遍讲解</button>' +
          '<button class="btn btn-ghost" data-act="retry">直接重新挑战</button>' +
          '<button class="btn-text" data-act="go" data-to="levels" data-replace="1">回到地图</button>';
      }
    } else {
      var left = wrongIds().length;
      html += '<div class="stars" role="img" aria-label="重练完成">' + starRow(quiz.cleared === n ? 3 : quiz.cleared > 0 ? (quiz.cleared * 2 >= n ? 2 : 1) : 0) + '</div>';
      html += '<h1>' + (quiz.cleared === n ? '全部掌握！' : quiz.cleared ? '有进步' : '再来一次') + '</h1>' +
        '<p class="result-sub">这次掌握了 ' + quiz.cleared + ' 题' + (left ? '，错题本里还剩 ' + left + ' 题。' : '，错题本已经清空。') + '</p>';
      html += '<div class="tiles"><div class="tile"><b>+' + quiz.gain + '</b><span>重练得分</span></div><div class="tile"><b>' + state.streak + '</b><span>当前连胜</span></div><div class="tile"><b>' + left + '</b><span>剩余错题</span></div></div>' + up;
      if (left) actions += '<button class="btn" data-act="go" data-to="review">继续重练剩下的 ' + left + ' 题</button>';
      actions += '<button class="btn' + (left ? ' btn-ghost' : '') + '" data-act="go" data-to="levels" data-replace="1">回到地图</button>';
    }
    html += '<div class="result-actions">' + actions + '</div></div>';
    $view.innerHTML = html;
    $bar.innerHTML = '';
  }

  /* ---------- 错题本 ---------- */
  function viewBook() {
    var ids = wrongIds();
    var html = topMain() + '<div class="page-head"><h1>错题本</h1><p>答错的题会自动收进这里。重练时答对，就会移走。</p></div>';
    if (!ids.length) {
      html += '<div class="empty">' + ICON.book + '<b>错题本是空的</b><span>' + (state.answered ? '所有错题都已经掌握了。' : '还没有开始答题。去闯关吧。') + '</span></div>';
    } else {
      html += '<div class="book-cta"><button class="btn" data-act="go" data-to="review">' + ICON.redo + '全部重练 · ' + ids.length + ' 题</button></div>';
      var lastLi = -1;
      ids.forEach(function (id) {
        var e = Q_INDEX[id], q = e.q;
        if (e.li !== lastLi) { if (lastLi !== -1) html += '</div>'; html += '<div class="book-group"><h2>第 ' + (e.li + 1) + ' 关 · ' + esc(LEVELS[e.li].title) + '</h2>'; lastLi = e.li; }
        html += '<div class="wq"><div class="wq-top"><span class="q-type">' + TYPE_NAME[q.type] + '</span><span class="wq-n">错了 ' + state.wrong[id].n + ' 次</span></div>' +
          '<div class="wq-stem">' + fmt(q.q) + '</div>' + (q.code ? '<pre class="code" tabindex="0">' + hl(q.code) + '</pre>' : '') +
          '<button class="btn btn-sm btn-ghost" data-act="review-one" data-id="' + id + '">重练这道题</button></div>';
      });
      html += '</div>';
    }
    $view.innerHTML = html;
    $bar.innerHTML = tabbar('notebook');
  }

  /* ---------- 我的 ---------- */
  function viewMe() {
    var r = rankInfo(state.xp), passed = 0;
    for (var i = 0; i < LEVELS.length; i++) if (starsOf(i)) passed++;
    var acc = state.answered ? Math.round(state.correct / state.answered * 100) + '%' : '—';
    var html = topMain() + '<div class="page-head"><h1>我的</h1></div>';
    if (!saveOk) html += '<p class="warn" style="margin-top:12px">这个浏览器现在不能保存进度（可能开了无痕模式，或者禁用了网站数据）。关掉页面后进度会丢失。</p>';
    html += '<div class="card"><div class="me-rank"><span class="rank-badge"><small>Lv</small>' + r.lv + '</span><div class="me-rank-main"><div class="me-rank-name">' + esc(r.name) + '</div>' +
      '<div class="xpbar" role="img" aria-label="升级进度 ' + r.pct + '%"><i style="width:' + r.pct + '%"></i></div>' +
      '<div class="me-rank-next">' + (r.next ? '再得 <span class="num">' + r.need + '</span> 分升到 Lv' + (r.lv + 1) + ' ' + esc(r.next.name) : '已经是最高等级') + '</div></div></div>' +
      '<div class="grid2"><div class="tile"><b>' + state.xp + '</b><span>总积分</span></div><div class="tile"><b>' + totalStars() + '/' + LEVELS.length * 3 + '</b><span>星星</span></div>' +
      '<div class="tile"><b>' + passed + '/' + LEVELS.length + '</b><span>已通关</span></div><div class="tile"><b>' + state.best + '</b><span>最高连胜</span></div>' +
      '<div class="tile"><b>' + acc + '</b><span>正确率（共答 ' + state.answered + ' 题）</span></div><div class="tile"><b>' + dayStreak() + '</b><span>连续学习天数</span></div></div></div>';
    html += '<div class="card"><h2>各章进度</h2><div class="chap-rows">' + CHAPTERS.map(function (ch, ci) {
      var ls = LEVELS.filter(function (l) { return l.ch === ch.id; });
      var d = ls.filter(function (l) { return state.levels[l.id] && state.levels[l.id].stars; }).length;
      return '<div class="chap-row"><b>第' + CN[ci] + '章 ' + esc(ch.title) + '</b><span>' + d + '/' + ls.length + '</span><div class="xpbar"><i style="width:' + Math.round(d / ls.length * 100) + '%"></i></div></div>';
    }).join('') + '</div></div>';
    html += '<div class="card"><h2>分享给朋友</h2><p>把这个页面的链接发给朋友，对方打开就能玩，不用注册。每个人的进度只保存在自己的手机里，互不影响。</p>' +
      (STANDALONE ? '<button class="btn btn-ghost" data-act="share">' + ICON.share + '分享链接</button>' : '') + '</div>';
    html += '<div class="card"><h2>添加到手机桌面</h2><ol class="steps">' +
      '<li><b>苹果手机：</b>用 Safari 打开本页，点底部的分享按钮，选“添加到主屏幕”。</li>' +
      '<li><b>安卓手机：</b>在浏览器右上角的菜单里，选“添加到主屏幕”或“安装应用”。</li>' +
      '<li>添加之后，建议一直从桌面图标进入，进度保存在那里。</li></ol></div>';
    html += '<div class="card"><h2>学习进度</h2><p>进度保存在这台设备的这个浏览器里。换手机、换浏览器或清除浏览器数据后，进度不会跟过去。</p>' +
      (resetAsk ? '<div class="confirm"><p><b>确定清空全部进度吗？</b>积分、星星和错题本都会删除，无法恢复。</p><div class="confirm-row"><button class="btn btn-sm btn-ghost" data-act="reset-no">取消</button><button class="btn btn-sm btn-bad" data-act="reset-yes">确定清空</button></div></div>'
        : '<button class="btn-text" data-act="reset-ask" style="color:var(--bad)">清空进度，从头开始</button>') + '</div>';
    $view.innerHTML = html;
    $bar.innerHTML = tabbar('me');
  }

  /* ---------- 事件 ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act'), it;
    if (act === 'go') go(el.getAttribute('data-to'), !!el.getAttribute('data-replace'));
    else if (act === 'open') {
      var i = +el.getAttribute('data-i');
      if (unlocked(i)) go('level-' + (i + 1));
      else toast('先通过第 ' + (currentIndex() + 1) + ' 关，才能解锁这一关');
    }
    else if (act === 'start') go('quiz-' + (+el.getAttribute('data-i') + 1));
    else if (act === 'run') runDemo(+el.getAttribute('data-i'));
    else if (act === 'copy') copyText(LEVELS[+el.getAttribute('data-i')].example.code, '代码已复制');
    else if (act === 'pick') {
      it = quiz && quiz.items[quiz.pos];
      if (!it || it.done) return;
      it.picked = +el.getAttribute('data-k');
      Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (b, k) {
        b.classList.toggle('is-picked', k === it.picked); b.setAttribute('aria-pressed', k === it.picked);
      });
      var c = $('#confirm'); if (c) c.disabled = false;
    }
    else if (act === 'confirm') confirmAnswer();
    else if (act === 'next') nextQuestion();
    else if (act === 'key') insertKey(el.getAttribute('data-ch'));
    else if (act === 'quit') go(quiz && quiz.mode === 'review' ? 'notebook' : 'levels');
    else if (act === 'retry') { startLevelQuiz(quiz.li); viewQuiz(); window.scrollTo(0, 0); }
    else if (act === 'review-one') { pendingReview = [el.getAttribute('data-id')]; go('review'); }
    else if (act === 'review-these') {
      pendingReview = quiz.items.filter(function (x) { return !x.ok; }).map(function (x) { return x.q.id; });
      go('review', true);
    }
    else if (act === 'reset-ask') { resetAsk = true; viewMe(); }
    else if (act === 'reset-no') { resetAsk = false; viewMe(); }
    else if (act === 'reset-yes') { state = freshState(); save(); resetAsk = false; quiz = null; viewMe(); window.scrollTo(0, 0); toast('进度已清空'); }
    else if (act === 'share') {
      var url = location.href.split('#')[0];
      if (navigator.share) navigator.share({ title: 'Python 蟒蛇闯关', text: '从零开始学 Python 的闯关小游戏，打开就能玩', url: url }).catch(function () {});
      else copyText(url, '链接已复制，发给朋友吧');
    }
  });
  // 点符号键时不让输入框失去焦点，键盘就不会收起
  document.addEventListener('mousedown', function (e) { if (e.target.closest && e.target.closest('.key')) e.preventDefault(); });
  function onFillInput() {
    var el = $('#fill'), it = quiz && quiz.items[quiz.pos];
    if (!el || !it || it.done) return;
    it.input = el.value;
    var c = $('#confirm'); if (c) c.disabled = !canConfirm(it);
  }
  function insertKey(ch) {
    var el = $('#fill');
    if (!el || el.disabled) return;
    var s = el.selectionStart == null ? el.value.length : el.selectionStart, e2 = el.selectionEnd == null ? s : el.selectionEnd;
    el.value = el.value.slice(0, s) + ch + el.value.slice(e2);
    el.focus();
    try { el.setSelectionRange(s + ch.length, s + ch.length); } catch (x) {}
    onFillInput();
  }
  document.addEventListener('input', function (e) { if (e.target && e.target.id === 'fill') onFillInput(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'fill') { e.preventDefault(); e.target.blur(); confirmAnswer(); }
  });
  window.addEventListener('hashchange', render);

  render();
})();

})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
